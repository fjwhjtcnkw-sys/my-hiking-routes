<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Маршруты Карпаты</title>

  <!-- PWA настройки для iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Маршруты">
  
  <!-- Иконка на рабочем столе iPhone (зеленый компас) -->
  <link rel="apple-touch-icon" href="https://img.icons8.com/isometric/512/compass.png">

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --text-color: #ffffff;
      --sec-text: #a1a1a6;
      --accent-color: #30d158;
      --btn-active: #24a143;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px;
    }

    header {
      padding: 16px 8px 20px 8px;
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      margin: 0 0 4px 0;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--sec-text);
      margin: 0;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-bottom: 30px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .image-container {
      position: relative;
      width: 100%;
      height: 210px;
      background: #2c2c2e;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
    }

    .content {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.3px;
    }

    .description {
      font-size: 14px;
      color: var(--sec-text);
      line-height: 1.45;
      margin: 0;
    }

    .btn {
      margin-top: 6px;
      background-color: var(--accent-color);
      color: #000000;
      text-decoration: none;
      text-align: center;
      font-weight: 700;
      font-size: 16px;
      padding: 14px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease;
    }

    .btn:active {
      background-color: var(--btn-active);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <header>
    <h1>Маршруты</h1>
    <p class="subtitle">От домика (48.2538, 24.9170)</p>
  </header>

  <div class="container" id="spots-container"></div>

  <script>
    const spots = [
      {
        title: "Скала Писаный Камень",
        distance: "10 км от вас",
        description: "Огромные скалы высотой до 20 м с древними петроглифами. Панорамный вид на Гуцульщину.",
        image: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80",
        lat: 48.1818,
        lon: 24.9792
      },
      {
        title: "Хребет Игрец",
        distance: "8 км от вас",
        description: "Живописный хребет с пастушьими полонинами и отличным видом на весь Черногорский хребет.",
        image: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80",
        lat: 48.2056,
        lon: 24.8450
      },
      {
        title: "Кривопольский перевал",
        distance: "6 км от вас",
        description: "Один из самых высоких перевалов Карпат (961 м). Легкий маршрут по пологим холмам.",
        image: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80",
        lat: 48.2323,
        lon: 24.8820
      },
      {
        title: "Обзорная вершина в Верховине",
        distance: "3.5 км от вас",
        description: "Короткая прогулка через сосновый лес к площадке с видом на долину Чёрного Черемоша.",
        image: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=80",
        lat: 48.2450,
        lon: 24.9010
      }
    ];

    const container = document.getElementById('spots-container');

    spots.forEach(spot => {
      const mapsMeUrl = `mapsme://map?ll=${spot.lat},${spot.lon}&n=${encodeURIComponent(spot.title)}`;
      
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="image-container">
          <img src="${spot.image}" alt="${spot.title}" loading="lazy">
          <div class="badge">📍 ${spot.distance}</div>
        </div>
        <div class="content">
          <h2 class="title">${spot.title}</h2>
          <p class="description">${spot.description}</p>
          <a href="${mapsMeUrl}" class="btn">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            Открыть в MAPS.ME
          </a>
        </div>
      `;
      container.appendChild(card);
    });
  </script>
</body>
</html>
